<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 Image Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-animated"></div>

  <header class="header">
    <div class="logo">🖼️ Base64 Generator</div>
    <p class="subtitle">Carica un'immagine o creane una al volo — ottieni il base64 istantaneamente</p>
  </header>

  <main class="container">
    <!-- Tab Switcher -->
    <div class="tabs">
      <button class="tab active" data-tab="upload">📤 Carica Immagine</button>
      <button class="tab" data-tab="generate">🎨 Genera Immagine</button>
    </div>

    <!-- Upload Panel -->
    <section class="panel active" id="panel-upload">
      <div class="dropzone" id="dropzone">
        <div class="dropzone-content">
          <div class="drop-icon">📁</div>
          <p class="drop-text">Trascina qui la tua immagine</p>
          <p class="drop-or">oppure</p>
          <label class="btn btn-primary" for="fileInput">Sfoglia file</label>
          <input type="file" id="fileInput" accept="image/*" hidden>
          <p class="drop-hint">PNG, JPG, GIF, SVG, WebP • Max 10MB</p>
        </div>
      </div>
    </section>

    <!-- Generate Panel -->
    <section class="panel" id="panel-generate">
      <div class="generator-form">
        <div class="form-row">
          <div class="form-group">
            <label>Larghezza (px)</label>
            <input type="number" id="genWidth" value="400" min="10" max="4000">
          </div>
          <div class="form-group">
            <label>Altezza (px)</label>
            <input type="number" id="genHeight" value="300" min="10" max="4000">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Colore sfondo</label>
            <div class="color-input-wrap">
              <input type="color" id="genBgColor" value="#6366f1">
              <input type="text" id="genBgColorText" value="#6366f1" maxlength="7">
            </div>
          </div>
          <div class="form-group">
            <label>Colore testo</label>
            <div class="color-input-wrap">
              <input type="color" id="genTextColor" value="#ffffff">
              <input type="text" id="genTextColorText" value="#ffffff" maxlength="7">
            </div>
          </div>
        </div>
        <div class="form-group full">
          <label>Testo sull'immagine</label>
          <input type="text" id="genText" value="Hello World" placeholder="Testo da visualizzare...">
        </div>
        <div class="form-group full">
          <label>Dimensione testo (px)</label>
          <input type="range" id="genFontSize" min="12" max="120" value="48">
          <span class="range-value" id="genFontSizeVal">48px</span>
        </div>
        <button class="btn btn-secondary" id="btnGenerate">✨ Genera Immagine</button>
      </div>
    </section>

    <!-- Result Area -->
    <section class="result-section" id="resultSection" style="display:none;">
      <div class="result-header">
        <h2>✅ Risultato</h2>
        <div class="result-actions">
          <button class="btn btn-sm" id="btnCopy">📋 Copia Base64</button>
          <button class="btn btn-sm" id="btnDownload">💾 Scarica</button>
          <button class="btn btn-sm btn-danger" id="btnClear">🗑️ Cancella</button>
        </div>
      </div>
      <div class="result-preview">
        <img id="resultImage" alt="Preview">
      </div>
      <div class="result-info">
        <span id="resultSize"></span>
        <span id="resultDimensions"></span>
        <span id="resultType"></span>
      </div>
      <div class="base64-output">
        <label>Stringa Base64</label>
        <div class="textarea-wrap">
          <textarea id="base64Output" readonly rows="6" placeholder="Il base64 apparirà qui..."></textarea>
          <button class="btn btn-sm btn-copy-inline" id="btnCopyInline" title="Copia">📋</button>
        </div>
        <div class="base64-format-btns">
          <button class="btn btn-xs active" data-format="raw">Raw</button>
          <button class="btn btn-xs" data-format="datauri">Data URI</button>
          <button class="btn btn-xs" data-format="css">CSS url()</button>
          <button class="btn btn-xs" data-format="html">HTML img</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <footer class="footer">
    <p>Base64 Image Generator • Open Source • Fatto con ❤️</p>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
